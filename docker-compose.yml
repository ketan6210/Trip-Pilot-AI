services:
  db:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: trippilot
      POSTGRES_USER: trippilot
      POSTGRES_PASSWORD: trippilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://trippilot:trippilot@db:5432/trippilot
      ORCHESTRATOR_PROVIDER: ${ORCHESTRATOR_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-Qwen/Qwen3-32B:deepinfra}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_CORRECTION_ATTEMPTS: ${LLM_CORRECTION_ATTEMPTS:-2}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
      AI_SOLVER_SECONDS: ${AI_SOLVER_SECONDS:-3}
      AI_CANDIDATE_LIMIT: ${AI_CANDIDATE_LIMIT:-40}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-concept_hash}
      PREFERENCE_EMBEDDING_MODEL: ${PREFERENCE_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      PLACE_PROVIDER: ${PLACE_PROVIDER:-live}
      CITY_SEARCH_URL: ${CITY_SEARCH_URL:-https://geocoding-api.open-meteo.com/v1/search}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_FALLBACK_URL: ${OVERPASS_FALLBACK_URL:-https://overpass.private.coffee/api/interpreter}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID:-}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET:-}
      AMADEUS_BASE_URL: ${AMADEUS_BASE_URL:-https://api.amadeus.com}
      FLIGHT_LOCATION_URL: ${FLIGHT_LOCATION_URL:-https://autocomplete.travelpayouts.com/places2}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      PROVIDER_ATTEMPTS: ${PROVIDER_ATTEMPTS:-3}
      ROUTE_CACHE_SECONDS: ${ROUTE_CACHE_SECONDS:-900}
      PLACE_CACHE_HOURS: ${PLACE_CACHE_HOURS:-24}
      FLIGHT_CACHE_MINUTES: ${FLIGHT_CACHE_MINUTES:-15}
      LIVE_DATA_TIMEOUT_SECONDS: ${LIVE_DATA_TIMEOUT_SECONDS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SKYSCANNER_API_KEY: ${SKYSCANNER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
