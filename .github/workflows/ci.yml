name: Test TripPilot
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: trippilot_test
          POSTGRES_USER: trippilot
          POSTGRES_PASSWORD: trippilot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U trippilot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests migrations scripts/evaluate_planning.py scripts/assign_legacy_owner.py
      - run: ruff format --check backend tests migrations scripts/evaluate_planning.py scripts/assign_legacy_owner.py
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trippilot:trippilot@localhost:5432/trippilot_test
      - run: python -m scripts.evaluate_planning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-evaluation
          path: artifacts/phase2-evaluation.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
